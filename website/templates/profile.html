<!DOCTYPE html>
<html>
<head>
    <title>Профиль</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Привет</h1>
        
        <div class="info">
            <p><strong>Логин:</strong> {{ user[0] }}</p>
            <p><strong>Email:</strong> {{ user[1] }}</p>
        </div>
        
        <button id="showKeyBtn">Показать ключ</button>

    	<div id="keyBox">
            <input id="keyUrl" readonly value="{{ request.host_url }}profile/get-key/{{ user[2] }}">
            <button id="copyBtn">Копировать</button>
            <hr>
            <a href="/profile/regenerate">
                <button>Создать новый ключ</button>
            </a>
    	</div>
        
        <p>
            <a href="/logout" class="logout">Выйти</a>
        </p>
    </div>
    <script src="{{ url_for('static', filename='profile.js') }}"></script>
</body>
</html>
